<style>
/* ---------- Tokens ---------- */
:root{
  --purpura:#4A2C6B; --purpura-suave:#EDE6F3; --ocre:#C89B3C; --ocre-suave:#F6ECD3; --ocre-texto:#8A6514;
  --papel:#FAFAF7; --blanco:#FFFFFF; --tinta:#1E1B26; --gris:#6E6878; --linea:#E4E0E8;
  --rojo:#B3261E; --verde:#2E7D4F;
  --sans:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Arial,sans-serif;
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
  --top:env(safe-area-inset-top,0px); --bottom:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--papel);color:var(--tinta);font-family:var(--sans);font-size:17px;line-height:1.4;overscroll-behavior-y:none}
body{-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input,select{font:inherit;color:inherit}
h1,h2,h3{margin:0;font-weight:600}

/* ---------- Disposición: panel izquierdo + nota a la derecha ---------- */
html,body{height:100%;overflow:hidden}
.app{display:flex;height:100%;width:100%}
.col{height:100%;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;position:relative;min-width:0}
#panel{flex:none;width:100%}
.app.dividido #panel{width:var(--panel,360px);border-right:1px solid var(--linea);background:var(--papel)}
.app.dividido #detalle{flex:1;background:var(--blanco)}
.app.dividido.plegado #panel,.app.dividido.plegado .divisor{display:none}
.app:not(.dividido) #detalle,.app:not(.dividido) .divisor{display:none}
.divisor{flex:none;width:14px;background:#EEEAF2;border-right:1px solid var(--linea);cursor:col-resize;display:flex;align-items:center;justify-content:center;touch-action:none;-webkit-user-select:none;user-select:none}
.divisor{position:relative}.divisor::before{content:'';position:absolute;top:0;bottom:0;left:-15px;right:-15px;z-index:5}
.divisor:active,.divisor.activo{background:var(--purpura-suave)}
.asa-div{width:4px;height:44px;border-radius:2px;background:#B9B3C4}
.vacio-detalle{height:100%;padding-top:calc(var(--top) + var(--banda,0px) + 40px);display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--gris);text-align:center;padding:40px;gap:8px}
.vacio-detalle b{color:var(--tinta);font-size:19px}
.vacio-detalle img{width:72px;height:72px;border-radius:16px;opacity:.9;margin-bottom:8px}
.app.dividido .cont,.app.dividido .editor{max-width:none;margin:0}
/* ---------- Cabecera ---------- */
.cab{position:sticky;top:0;z-index:20;background:var(--purpura);color:#fff;padding:calc(var(--top) + var(--banda,0px) + 8px) 12px 8px calc(12px + var(--sangria,0px));display:flex;align-items:center;gap:8px;min-height:calc(var(--top) + var(--banda,0px) + 52px)}
.app.dividido:not(.plegado) #detalle .cab{padding-left:12px}
/* Panel angosto: en vez de hueco a la izquierda, los botones bajan a una fila propia bajo los controles de la ventana */
.app.dividido.estrecho #panel .cab{padding-left:12px;padding-top:calc(var(--top) + var(--banda,0px) + var(--sangria-banda,0px) + 8px)}
.app.dividido.estrecho #panel .cab:before{content:'';position:absolute;left:0;right:0;top:0;height:calc(var(--top) + var(--banda,0px) + var(--sangria-banda,0px));background:rgba(0,0,0,.18)}
.app.dividido.estrecho #panel .cab h1{flex:1 1 100%;text-align:left} /* sólo la columna pegada al borde izquierdo necesita el hueco */
.cab.con-banda:before{content:'';position:absolute;left:0;right:0;top:0;height:calc(var(--top) + var(--banda,0px));background:rgba(0,0,0,.18);border-bottom:1px solid rgba(255,255,255,.12)}
.cab h1{font-size:17px;flex:1 1 140px;min-width:0;text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
.cab .btn{min-width:0;min-height:44px;padding:8px 10px;font-size:16px;color:#fff;border-radius:8px;white-space:nowrap}
.cab .grupo{display:flex;gap:2px;align-items:center;flex-wrap:wrap;max-width:100%}
.cab{flex-wrap:wrap;row-gap:2px}
.app.dividido #panel .cab .btn{padding:8px 8px;font-size:15px}
.app.dividido #panel .tarjeta .cat,.app.dividido #panel .tarjeta .etq{max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;vertical-align:bottom}
.app.dividido #panel .boton{white-space:normal}
.app.dividido #panel .barra-acc .boton{font-size:14px;padding:10px 8px}
.cab .btn:active{background:rgba(255,255,255,.15)}
.cab .btn.der{text-align:right}
.cab .btn.izq{text-align:left}
.cab .btn.destacado{font-weight:700;color:var(--ocre-texto)}
.cab .icono{width:28px;height:28px;border-radius:7px;vertical-align:middle}

/* ---------- Contenido ---------- */
.cont{padding:0 0 calc(var(--bottom) + 24px)}
.seccion{padding:22px 16px 6px;color:var(--gris);font-size:14px;font-weight:600}
.lista{background:var(--blanco);border-top:1px solid var(--linea);border-bottom:1px solid var(--linea)}
.fila{display:flex;align-items:center;gap:12px;padding:13px 16px;border-bottom:1px solid var(--linea);width:100%;text-align:left;min-height:52px}
.fila:last-child{border-bottom:0}
.fila:active{background:var(--purpura-suave)}
.fila .abr{width:44px;font-size:13px;color:var(--gris);font-family:var(--serif);flex:none}
.fila .nom{flex:1;font-size:17px}
.fila .cnt{font-size:13px;color:var(--purpura);background:var(--ocre-suave);border-radius:12px;padding:2px 9px;min-width:26px;text-align:center;font-weight:600}
.fila .flecha{color:#C5BFD0;font-size:20px}

.malla{display:grid;grid-template-columns:repeat(auto-fill,minmax(58px,1fr));gap:10px;padding:16px}
.celda{aspect-ratio:1;border-radius:12px;background:var(--blanco);border:1px solid var(--linea);font-size:18px;font-weight:500;display:flex;align-items:center;justify-content:center;position:relative}
.celda.con{background:var(--ocre-suave);border-color:var(--ocre);color:var(--purpura);font-weight:700}
.celda:active{background:var(--purpura-suave)}

.tarjeta{display:block;width:100%;text-align:left;background:var(--blanco);border-bottom:1px solid var(--linea);padding:14px 16px}
.tarjeta:active{background:var(--purpura-suave)}
.tarjeta .ref{font-family:var(--serif);color:var(--ocre-texto);font-weight:700;font-size:15px}
.tarjeta .tit{font-size:17px;font-weight:600;margin:2px 0}
.tarjeta .prev{color:var(--gris);font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tarjeta .fecha{color:#6E6878;font-size:12px;margin-top:4px}

.vacio{padding:56px 28px;text-align:center;color:var(--gris);font-size:16px;line-height:1.5}
.vacio b{display:block;color:var(--tinta);font-size:18px;margin-bottom:6px}
.boton{display:inline-block;margin-top:16px;padding:12px 22px;border-radius:12px;background:var(--purpura);color:#fff;font-weight:600;font-size:16px}
.boton.secundario{background:var(--purpura-suave);color:var(--purpura)}
.boton.peligro{background:#FBE9E7;color:var(--rojo)}
.boton.armado{background:var(--rojo);color:#fff}
.boton:active{opacity:.85}

/* ---------- Editor de nota ---------- */
.editor{background:var(--blanco);min-height:100%}
.editor .meta{display:flex;align-items:center;gap:8px;padding:12px 16px;border-bottom:1px solid var(--linea);font-family:var(--serif);color:var(--ocre-texto);font-weight:700;font-size:17px;flex-wrap:wrap}
.editor .meta select{border:1px solid var(--linea);border-radius:8px;padding:6px 8px;background:var(--papel);font-family:var(--sans);font-size:16px;color:var(--tinta);-webkit-appearance:none;appearance:none}
.editor .meta .a{color:var(--gris);font-family:var(--sans);font-weight:400;font-size:14px}
.editor .titulo-lect{margin:0;padding:16px 16px 6px;font-size:24px;font-weight:700;font-family:var(--serif);line-height:1.25;overflow-wrap:anywhere;color:var(--tinta)}
.chips-lect{padding:10px 16px 0}.chips-lect:empty{display:none}
.editor input.titulo{display:block;width:100%;border:0;outline:0;padding:16px 16px 6px;font-size:24px;font-weight:700;font-family:var(--serif);background:transparent}
.editor input.titulo::placeholder{color:#B9B3C4;font-weight:600}
.cuerpo{min-height:32vh;padding:8px 16px 140px;font-family:var(--serif);font-size:19px;line-height:1.6;outline:0;-webkit-user-select:text;user-select:text;word-wrap:break-word}
.cuerpo:empty:before{content:attr(data-ph);color:#B9B3C4;pointer-events:none}
.cuerpo b,.cuerpo strong{font-weight:700}
.cuerpo ul,.cuerpo ol{padding-left:26px}
.pie-nota{padding:10px 16px 130px;color:#6E6878;font-size:13px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}

/* Barra de formato: fija abajo, sube con el teclado (visualViewport) */
.barra{position:fixed;left:var(--barra-izq,0px);right:0;bottom:0;z-index:30;background:#F3F0F6;border-top:1px solid var(--linea);padding:6px 8px calc(var(--bottom) + 6px);display:none;gap:6px;overflow-x:auto;-webkit-overflow-scrolling:touch;white-space:nowrap;transform:translate3d(0,0,0)}
.barra.ver{display:flex}
.barra button{flex:none;min-width:44px;height:44px;border-radius:9px;background:var(--blanco);border:1px solid var(--linea);font-size:17px;font-family:var(--serif)}
.barra button:active,.barra button.activo{background:var(--purpura);color:#fff;border-color:var(--purpura)}
.barra .sep{flex:none;width:1px;background:var(--linea);margin:4px 2px}
.barra .col{width:40px;min-width:40px;border-radius:50%}
.barra .col span{display:block;width:22px;height:22px;border-radius:50%;margin:0 auto;border:1px solid rgba(0,0,0,.15)}
.barra .col.txt span{border-radius:4px}

/* ---------- Categorías, etiquetas y búsqueda ---------- */
.cat{display:inline-block;font-size:12px;font-weight:600;color:#fff;border-radius:10px;padding:2px 8px;margin:4px 6px 0 0;vertical-align:middle}
.etq{display:inline-block;font-size:12px;color:var(--purpura);background:var(--purpura-suave);border-radius:10px;padding:2px 8px;margin:4px 6px 0 0}
.fuente{display:inline-block;font-size:12px;color:var(--gris);margin:4px 0 0}
.editor .clasif{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:10px 16px;border-bottom:1px solid var(--linea);background:var(--papel)}
.editor .clasif select,.editor .clasif input{width:100%;border:1px solid var(--linea);border-radius:8px;padding:8px 10px;background:var(--blanco);font-size:15px;-webkit-appearance:none;appearance:none;font-family:var(--sans);color:var(--tinta)}
.editor .clasif input{grid-column:1/-1}
.editor .clasif label{font-size:12px;color:var(--gris);display:block;margin-bottom:3px}
.busq{position:sticky;top:calc(var(--top) + var(--banda,0px) + 52px);z-index:15;background:var(--papel);padding:10px 12px 8px;border-bottom:1px solid var(--linea)}
.busq input[type=search]{width:100%;border:1px solid var(--linea);border-radius:12px;padding:11px 14px;font-size:17px;background:var(--blanco);-webkit-appearance:none;appearance:none}
.filtros{display:flex;gap:8px;margin-top:8px;overflow-x:auto;-webkit-overflow-scrolling:touch}
.filtros select{flex:none;border:1px solid var(--linea);border-radius:10px;padding:7px 10px;font-size:14px;background:var(--blanco);-webkit-appearance:none;appearance:none;color:var(--purpura);font-weight:600;max-width:46vw;text-overflow:ellipsis}
.resumen{padding:12px 16px 4px;color:var(--gris);font-size:14px}
.resultado .libro{font-family:var(--serif);color:var(--ocre-texto);font-weight:700;font-size:15px}
mark{background:#FFF3A8;color:inherit;padding:0 1px;border-radius:2px}
/* ---------- Numeración de notas en el capítulo ---------- */
.tarjeta{display:flex;gap:12px;align-items:flex-start}
.num{flex:none;width:34px;height:34px;border-radius:50%;color:#fff;font-weight:700;font-size:15px;display:flex;align-items:center;justify-content:center;margin-top:2px;font-family:var(--sans)}
.tarjeta .cuerpo-tarjeta{flex:1;min-width:0}
.grupo-vers{padding:14px 16px 6px;background:var(--papel);font-family:var(--serif);font-size:16px;font-weight:700;color:var(--purpura);border-bottom:1px solid var(--linea);display:flex;justify-content:space-between;align-items:baseline}
.grupo-vers small{font-family:var(--sans);font-weight:400;color:var(--gris);font-size:13px}
.tarjeta .ref-vers{font-family:var(--sans);font-size:12px;color:var(--gris)}
.editor .pos{font-family:var(--sans);font-weight:400;font-size:13px;color:var(--gris);margin-left:auto}
/* ---------- Importador ---------- */
.barra-acc{display:flex;flex-wrap:wrap;gap:10px;padding:12px 16px 0}
.ir-a{display:flex;gap:8px;padding:12px 16px 0;align-items:center}
.ir-a input{flex:1;min-width:0;height:44px;border:1px solid var(--linea);border-radius:10px;padding:0 12px;font-size:17px;background:var(--blanco);font-family:var(--sans)}
.ir-a .boton{margin:0;flex:none;min-height:44px}
.modo-libros{display:flex;gap:6px;padding:10px 16px 0;align-items:center;color:var(--gris);font-size:14px}
.modo-libros button{min-height:44px;padding:0 12px;border-radius:9px;border:1px solid var(--linea);background:var(--blanco);font-size:14px;color:var(--tinta)}
.modo-libros button.act{background:var(--purpura);color:#fff;border-color:var(--purpura)}
.reja{display:grid;grid-template-columns:repeat(auto-fill,minmax(62px,1fr));gap:6px;padding:10px 12px 14px}
.teja{position:relative;min-height:54px;border-radius:8px;color:#fff;font-weight:700;font-size:15px;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.1;padding:4px 2px}
.teja small{font-size:11px;font-weight:600;opacity:.95;margin-top:3px;background:rgba(255,255,255,.28);border-radius:8px;padding:0 6px}
.teja:active{filter:brightness(.88)}
.leyenda-reja{display:flex;flex-wrap:wrap;gap:6px 12px;padding:0 16px 6px;font-size:12px;color:var(--gris)}
.leyenda-reja span:before{content:'';display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px;background:var(--c)}
.cap-texto{padding:12px 18px 40px;font-family:var(--serif);font-size:19px;line-height:1.75;color:var(--tinta)}
.cap-texto sup{color:var(--ocre-texto);font-size:12px;font-weight:700;margin:0 3px 0 2px;font-family:var(--sans)}
.cap-texto .vt.con{background:var(--ocre-suave);border-radius:4px;box-decoration-break:clone;-webkit-box-decoration-break:clone}
.cap-texto p.vt{margin:0 0 10px;padding:6px 8px}
.cap-texto .aviso-texto{font-family:var(--sans);font-size:15px;color:var(--gris);margin-bottom:12px}
.marca{display:inline-flex;align-items:center;justify-content:center;min-width:30px;height:30px;padding:0 6px;border-radius:15px;color:#fff;font:700 13px var(--sans);margin:0 5px 0 1px;vertical-align:3px;border:0;position:relative}
.marca::after{content:'';position:absolute;inset:-7px}
.rp-num{display:inline-block;min-width:20px;padding:0 6px;border-radius:10px;background:var(--rojo);color:#fff;font-size:12px;margin-left:4px}
.rp-prog{display:flex;align-items:center;gap:10px;padding:12px 16px;color:var(--gris);font-size:15px}
.rp-tarjeta{margin:0 16px;padding:22px 20px;background:var(--blanco);border:1px solid var(--linea);border-radius:18px;box-shadow:0 4px 18px rgba(0,0,0,.06)}
.rp-ref{font-family:var(--serif);color:var(--ocre-texto);font-weight:700;font-size:15px;margin-bottom:6px}
.rp-tit{font-family:var(--serif);font-size:23px;font-weight:700;line-height:1.3;color:var(--tinta)}
.rp-preg{margin-top:14px;color:var(--gris);font-size:15px}
.rp-linea{border:0;border-top:1px dashed var(--linea);margin:18px 0}
.rp-pts{margin:0 0 10px 20px;padding:0;line-height:1.5;font-size:17px}
.rp-res{font-family:var(--serif);font-size:18px;line-height:1.6;margin:0}
.rp-vers{margin:12px 0 0}
.rp-botones{display:flex;flex-wrap:wrap;gap:10px;padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));position:sticky;bottom:0;background:var(--papel);border-top:1px solid var(--linea);z-index:3}
.rp-botones .boton{margin:0;flex:1 1 40%;min-height:52px}
.rp-grande{min-height:58px!important;font-size:18px!important;flex-basis:100%!important}
.rp-cal{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;flex:1 1 20%!important;color:#fff!important;border:0!important}
.rp-cal small{font-size:12px;opacity:.9;font-weight:500}
.rp-q0{background:#B3261E!important}.rp-q3{background:#A0731E!important}.rp-q4{background:#2E7D4F!important}.rp-q5{background:#3C7DA0!important}
.rp-filtros{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}.rp-filtros select{flex:1 1 30%;min-height:44px;min-width:140px}
.rp-lab{display:block;font-size:13px;color:var(--gris);margin:8px 0 4px}
#rpP,#rpR,#rpC{width:100%;box-sizing:border-box;border:1px solid var(--linea);border-radius:10px;padding:10px;font-size:16px;font-family:var(--sans)}
.destello{animation:destello 1.6s ease-out}
@keyframes destello{0%,40%{background:var(--ocre-suave)}100%{background:transparent}}
.barra-acc .boton{flex:1 1 28%;min-width:96px;text-align:center;margin:0;padding:11px 10px;font-size:15px}
.imp textarea{width:100%;min-height:180px;border:1px solid var(--linea);border-radius:12px;padding:12px;font:15px/1.4 var(--sans);background:var(--blanco);resize:vertical;-webkit-appearance:none}
.imp .opciones{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}
.imp .opciones label{font-size:12px;color:var(--gris);display:block;margin-bottom:3px}
.imp .opciones select,.imp .opciones input{width:100%;border:1px solid var(--linea);border-radius:8px;padding:8px 10px;background:var(--blanco);font-size:15px;-webkit-appearance:none;appearance:none;font-family:var(--sans);color:var(--tinta)}
.imp .opciones .ancho{grid-column:1/-1}
.prev-nota{background:var(--blanco);border-bottom:1px solid var(--linea);padding:12px 16px;display:flex;gap:12px;align-items:flex-start}
.prev-nota.mal{background:#FFF6F5}
.prev-nota .estado{flex:none;width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-size:14px;font-weight:700;margin-top:2px}
.prev-nota .ok{background:var(--verde)}.prev-nota .dup{background:#9A9A9A}.prev-nota .err{background:var(--rojo)}
.prev-nota .det{flex:1;min-width:0}
.prev-nota .tit{font-weight:600}
.prev-nota .ref{font-family:var(--serif);color:var(--ocre-texto);font-weight:700;font-size:15px}
.prev-nota .aviso-l{color:var(--rojo);font-size:13px;margin-top:3px}
.prev-nota .nota-txt{color:var(--gris);font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prev-nota select{margin-top:6px;border:1px solid var(--linea);border-radius:8px;padding:6px 8px;font-size:14px;background:var(--blanco);max-width:100%;-webkit-appearance:none;appearance:none}
.prev-nota input.vers-man{width:80px;margin:6px 0 0 6px;border:1px solid var(--linea);border-radius:8px;padding:6px 8px;font-size:14px}
.resumen-imp{padding:12px 16px;font-size:14px;color:var(--gris)}
/* ---------- Citas, hoja emergente y referencias cruzadas ---------- */
.citas{padding:10px 16px 0;border-top:1px solid var(--linea);background:var(--papel)}
.citas h4{margin:0 0 6px;font-size:13px;color:var(--gris);font-weight:600}
.chip-ref{display:inline-block;margin:0 8px 8px 0;padding:11px 14px;border-radius:14px;background:var(--ocre-suave);color:var(--purpura);font-family:var(--serif);font-weight:700;font-size:15px;border:1px solid #E8D9B0}
.chip-ref.con-notas{background:var(--purpura-suave);border-color:#D9CCE6}
.chip-ref:active{opacity:.7}
.relacionadas .tarjeta{padding:10px 16px}
.velo{position:fixed;inset:0;background:rgba(30,27,38,.35);z-index:60;display:none}
.velo.ver{display:block}
#avisoFijo{position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom));z-index:200;background:#B3261E;color:#fff;border-radius:12px;padding:12px 14px;display:flex;gap:12px;align-items:center;font-size:16px;line-height:1.35;box-shadow:0 6px 24px rgba(0,0,0,.3)}
#avisoFijo span{flex:1}
#avisoFijo button{flex:none;min-height:44px;padding:0 14px;border-radius:10px;border:0;background:#fff;color:#B3261E;font-weight:700;font-size:16px}
.hoja{position:fixed;left:0;right:0;bottom:0;z-index:61;background:var(--blanco);border-radius:18px 18px 0 0;max-height:78vh;overflow:auto;-webkit-overflow-scrolling:touch;padding:14px 18px calc(var(--bottom) + 18px);box-shadow:0 -6px 24px rgba(0,0,0,.15);transform:translateY(105%);transition:transform .22s ease-out}
.hoja.ver{transform:translateY(0);visibility:visible}
.hoja{visibility:hidden;transition:transform .22s ease-out,visibility .22s}
.hoja .asa{width:38px;height:5px;border-radius:3px;background:#D8D2E0;margin:0 auto 12px}
.hoja h3{font-family:var(--serif);color:var(--purpura);font-size:20px;margin-bottom:8px}
.hoja .texto{font-family:var(--serif);font-size:18px;line-height:1.6;margin-bottom:12px}
.hoja .texto sup{color:var(--ocre-texto);font-size:12px;font-weight:700;margin-right:3px;font-family:var(--sans)}
.hoja .falta{color:var(--gris);font-size:15px;line-height:1.5;margin-bottom:12px}
.hoja .acciones{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.hoja .acciones .boton{margin:0;padding:9px 14px;font-size:14px}
.hoja .lista{border:1px solid var(--linea);border-radius:12px;overflow:hidden}
.grupo-vers{cursor:pointer}.grupo-vers:active{background:var(--purpura-suave)}
.cuerpo sup{color:var(--ocre-texto);font-size:11px;font-weight:700}
.cuerpo blockquote{margin:8px 0;padding:6px 12px;border-left:3px solid var(--ocre);color:#3E3949;font-size:17px}
@media (min-width:700px){.hoja{max-width:640px;left:50%;right:auto;transform:translate(-50%,105%)}.hoja.ver{transform:translate(-50%,0)}}
@media (prefers-reduced-motion:reduce){.hoja{transition:none}}
/* ---------- Compartir y PDF ---------- */
.acciones-nota{display:flex;gap:8px;flex-wrap:wrap;padding:12px 16px 0;border-top:1px solid var(--linea)}
.acciones-nota .boton{margin:0;padding:10px 14px;font-size:14px}
.pie-busq{padding:8px 16px 24px}
/* ---------- Barra de formato vertical (lado izquierdo de la nota) ---------- */
.barra.vertical{left:var(--barra-izq,0px);right:auto;top:calc(var(--top) + var(--banda,0px) + 52px);bottom:0;width:60px;flex-direction:column;overflow-y:auto;overflow-x:hidden;white-space:normal;padding:8px 6px calc(var(--bottom) + 8px);border-top:0;border-right:1px solid var(--linea);gap:6px;align-items:center}
.barra.vertical button{width:46px;min-width:46px!important;height:auto;min-height:44px;white-space:normal;line-height:1.1;padding:4px 2px;overflow-wrap:anywhere}
.barra.vertical .sep{width:36px;height:1px;margin:2px 0}
.app.dividido .editor.editando{padding-left:62px}
.editor.lectura .cuerpo{-webkit-user-select:text;user-select:text}
.editor.lectura .cuerpo:empty:before{content:'Toque Editar para escribir…'}
.editor .clasif select:disabled,.editor input:read-only{opacity:.85}
.cab .btn.modo{background:rgba(255,255,255,.14)}
/* ---------- Texto bíblico dentro de la nota y del capítulo ---------- */
.texto-vers{margin:0 16px 4px;padding:10px 14px;border-left:3px solid var(--ocre);background:var(--ocre-suave);border-radius:0 10px 10px 0;font-family:var(--serif);font-size:17px;line-height:1.55;color:#3E3949}
.texto-vers sup{color:var(--ocre-texto);font-weight:700;font-size:11px;font-family:var(--sans);margin-right:2px}
.texto-vers .sin{font-family:var(--sans);font-size:13px;color:var(--gris)}
.grupo-vers .tv{display:block;font-family:var(--serif);font-weight:400;font-size:14px;color:#3E3949;margin-top:4px;line-height:1.45;white-space:normal}
.grupo-vers{display:block}
.grupo-vers .fila-gv{display:flex;justify-content:space-between;align-items:baseline}
/* ---------- Citas tocables dentro del texto (modo lectura) ---------- */
.cita-link{color:var(--purpura);text-decoration:underline dotted var(--ocre);text-decoration-thickness:2px;text-underline-offset:3px;cursor:pointer;border-radius:3px;padding:0 1px}
.cita-link:active{background:var(--ocre-suave)}
.cuerpo.lectura-citas{-webkit-user-select:text;user-select:text}
/* ---------- Ajustes ---------- */
.panel{background:var(--blanco);border-top:1px solid var(--linea);border-bottom:1px solid var(--linea);padding:16px;margin-top:16px}
.panel h3{font-size:17px;margin-bottom:6px}
.panel p{margin:4px 0 12px;color:var(--gris);font-size:15px;line-height:1.5}
.panel .botones{display:flex;gap:10px;flex-wrap:wrap}
.panel .boton{margin-top:0}
.dato{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--linea);font-size:15px}
.dato:last-child{border-bottom:0}
.dato span:last-child{color:var(--gris)}

/* ---------- Aviso (toast) ---------- */
.aviso{position:fixed;left:50%;bottom:calc(var(--bottom) + 90px);transform:translateX(-50%);background:var(--tinta);color:#fff;padding:10px 18px;border-radius:20px;font-size:15px;z-index:50;opacity:0;transition:opacity .25s;pointer-events:none;max-width:88%;text-align:center}
.aviso.ver{opacity:1}
.oculto{display:none!important}
@media (prefers-reduced-motion:reduce){.aviso{transition:none}}

.disc{background:var(--blanco);border:1px solid var(--linea);border-radius:12px;padding:16px 18px;line-height:1.7}
.disc-meta{font-family:var(--sans);font-size:12px;color:#7a6b99;margin-bottom:10px}
.disc-sec{font-family:var(--sans);font-weight:bold;letter-spacing:1px;color:var(--purpura);margin:16px 0 6px;border-bottom:1px solid var(--linea);padding-bottom:4px}
.disc-min{font-weight:normal;color:#999;font-size:12px;letter-spacing:0}
.disc-ref{color:#7a6b99;font-size:13px}
.disc-puntos li{margin:0 0 12px 0}
.lector{position:fixed;right:12px;bottom:calc(var(--bottom) + 12px);z-index:40;display:none;align-items:center;gap:10px;background:#2B1B40;color:#fff;border-radius:16px;padding:10px 12px;box-shadow:0 10px 30px rgba(0,0,0,.28);width:min(560px,calc(100% - 24px));font-family:var(--sans)}
.lector.ver{display:flex}
/* v2.66: con el reproductor visible, la barra vertical deja espacio abajo para que ningún botón quede tapado */
body:has(.lector.ver) .barra.vertical{padding-bottom:calc(var(--bottom) + 110px)}
.lec-info{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.lec-info b{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lec-info span{font-size:12px;opacity:.8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-family:var(--serif)}
.lec-prog{height:3px;background:rgba(255,255,255,.2);border-radius:2px;margin-top:4px;overflow:hidden}
.lec-prog i{display:block;height:100%;width:0;background:#E9C46A}
.lec-btns{display:flex;gap:4px;flex:none}
.lec-btns button{min-width:40px;height:40px;border-radius:10px;border:0;background:rgba(255,255,255,.12);color:#fff;font-size:17px}
.lec-btns .lec-play{background:#E9C46A;color:#2B1B40;min-width:48px;font-size:20px}
.lec-btns .lec-vel{font-size:13px;font-weight:700}
@media (max-width:520px){.lec-btns [data-l="inicio"]{display:none}}
@keyframes entraDer{from{opacity:.2;transform:translateX(-40px)}to{opacity:1;transform:none}}
@keyframes entraIzq{from{opacity:.2;transform:translateX(40px)}to{opacity:1;transform:none}}
.entra-der{animation:entraDer .22s ease-out}
.entra-izq{animation:entraIzq .22s ease-out}
.cuerpo font[face]{font-size:1.18em}
.grupo-voz{margin:14px 0 6px;font:600 12px var(--sans);letter-spacing:.06em;text-transform:uppercase;color:var(--purpura)}
.fila-voz{display:flex;width:100%;align-items:center;justify-content:space-between;gap:10px;text-align:left;padding:11px 12px;margin:0 0 6px;border:1px solid var(--linea);border-radius:12px;background:var(--blanco);font-family:var(--sans)}
.fila-voz b{display:block;font-size:16px}.fila-voz small{display:block;font-size:12px;color:#6E6878;margin-top:2px}
.fila-voz.elegida{border-color:var(--purpura);background:#F4EEFB}
.fila-voz.robotica{opacity:.55}
.marca-voz{flex:none;font-size:13px;color:var(--purpura);font-weight:600}
.aviso-voz{background:#FFF7DB;border:1px solid #E9C46A;border-radius:12px;padding:12px 14px;font:14px/1.5 var(--sans);margin-bottom:6px}
.lec-btns button.pulsado{transform:scale(.9);filter:brightness(1.4)}
.lec-btns button{touch-action:manipulation;-webkit-user-select:none;user-select:none}

/* ---------- Mi bosquejo (v2.61) ---------- */
.flota-bq{position:fixed;z-index:62;min-height:52px;padding:12px 22px;white-space:nowrap;border-radius:999px;border:0;background:#2B1B40;color:#fff;font-weight:700;font-size:15px;box-shadow:0 8px 24px rgba(0,0,0,.28)}
.toast-bq{position:fixed;z-index:62;left:50%;bottom:calc(22px + var(--bottom));transform:translateX(-50%);max-width:92vw;background:var(--verde);color:#fff;padding:12px 18px;border-radius:14px;font-weight:600;font-size:15px;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.toast-bq.mal{background:var(--rojo)}
.panel-bosq{position:fixed;z-index:45;top:0;right:0;bottom:0;width:min(420px,100vw);background:var(--papel);border-left:1px solid var(--linea);box-shadow:-10px 0 30px rgba(0,0,0,.12);display:flex;flex-direction:column;padding:calc(10px + var(--top)) 12px calc(10px + var(--bottom))}
.pb-cab,.pb-sel{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.pb-cab b{font-size:16px;color:var(--purpura);white-space:nowrap}
.pb-sel select{flex:1;min-width:0;min-height:44px;padding:8px;font-size:15px;border:1px solid var(--linea);border-radius:10px;background:var(--blanco)}
.pb-btn{min-height:44px;padding:8px 12px;font-size:14px;border:1px solid var(--linea);border-radius:10px;background:var(--blanco);color:var(--purpura);font-weight:600}
.pb-cab .pb-btn{padding:8px 10px;font-size:13px}
.pb-peligro{color:var(--rojo)}
.pb-fmt{display:flex;flex-wrap:wrap;gap:3px;margin-bottom:6px}
.bq-f{min-width:40px;min-height:44px;padding:0 4px;border:1px solid var(--linea);background:var(--blanco);border-radius:10px;font-size:15px}
.bq-f small{font-size:9.5px;font-weight:800}
.bq-f[data-on="true"]{background:var(--purpura);color:#fff}
.pb-paleta{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:6px}
.bq-c{width:44px;height:44px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px var(--linea)}
.pb-cuerpo{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding-bottom:8px}
.pb-titulo{display:block;width:100%;min-height:44px;font-weight:700;font-size:16px;padding:8px;border:1px solid var(--linea);border-radius:10px;background:var(--blanco)}
.pb-vacio{padding:10px 2px;color:var(--gris);font-size:15px}
.pb-pie{display:flex;flex-wrap:wrap;gap:6px;padding-top:8px;border-top:1px solid var(--linea);padding-bottom:62px} /* 62 px libres: la etiqueta del hosting no tapa botones */
.bq-doc{min-height:60vh;margin-top:8px;padding:12px 14px;background:var(--blanco);border:1px solid var(--linea);border-radius:12px;outline:none;font-family:var(--serif);font-size:16px;line-height:1.6;color:var(--tinta);-webkit-user-select:text;user-select:text;overflow-wrap:anywhere}
.bq-doc p,.bq-doc div{margin:0 0 .8em}
.bq-doc h3{font-family:var(--sans);font-size:14px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;margin:1em 0 .5em;color:var(--ocre-texto,#8a6a12)}
.bq-doc:empty::before{content:attr(data-ph);color:#aaa}
.panel-bosq.completa{width:100vw;left:0;border-left:0}
.panel-bosq.completa .pb-cab,.panel-bosq.completa .pb-sel,.panel-bosq.completa .pb-fmt,.panel-bosq.completa .pb-paleta,.panel-bosq.completa .pb-cuerpo>*,.panel-bosq.completa .pb-pie{width:100%;max-width:880px;margin-left:auto;margin-right:auto}
.panel-bosq.completa .bq-doc{font-size:19px;line-height:1.7;padding:22px 26px}
.panel-bosq.completa .pb-cab{padding-left:var(--sangria,0px)}
.cab .btn-bosq[data-on="true"]{background:rgba(255,255,255,.18)}
/* en pantallas anchas la app se recorre y el bosquejo queda al lado */
@media(min-width:1000px){
  body.con-bosq #app{width:calc(100% - 420px)}
  body.con-bosq .barra:not(.vertical){right:420px}
  body.con-bosq .lector{right:432px}
  body.con-bosq .hoja,body.con-bosq .velo{right:420px}
}
/* v2.65 */
.cab .btn.destacado{color:#fff;background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.45);font-weight:700}
.aviso-portada{background:#FFF4C2;border:1px solid #E3BE3A;color:#4A3A00;border-radius:12px;padding:12px 14px;margin:10px 0;font-size:15px;line-height:1.35}
.aviso-portada .ap-btns{display:flex;gap:8px;margin-top:10px;justify-content:flex-start;flex-wrap:wrap}
.aviso-portada .ap-btns .boton{margin:0;min-height:44px}
.recientes{max-width:520px;margin:22px auto 0;text-align:left;padding:0 12px}
.recientes .lista{margin-top:6px}
.barra-espacio{height:10px;border-radius:5px;background:#E8E3EE;overflow:hidden;margin:8px 0 4px}
.barra-espacio i{display:block;height:100%}
.sub-espacio{font-size:15px;margin:14px 0 4px}
/* v2.66 · edición táctil, borrar desde la lista y revisión de notas */
.barra button,.bq-f,.bq-c,.mas-nota{touch-action:manipulation;-webkit-user-select:none;user-select:none}
.barra button[disabled],.bq-f[disabled]{opacity:.35}
.barra button[data-on="true"],.bq-f[data-on="true"]{background:var(--purpura);color:#fff;border-color:var(--purpura)}
.barra .ic{display:none}
@media (max-width:699px){.barra .et{display:none}.barra .ic{display:inline;font-size:18px}.barra button{font-size:18px}}
.zona-texto{-webkit-user-select:text;user-select:text;outline:none}
.cuerpo.zona-texto[contenteditable="true"],.bq-doc.zona-texto[contenteditable="true"]{box-shadow:inset 0 0 0 3px rgba(200,155,60,.4);border-radius:10px}
.ed-destello{animation:edDestello .6s ease}
@keyframes edDestello{0%{background:#FFF3A8}100%{background:transparent}}
.cuerpo span[style*="Snell"]{font-size:1.18em}
.bq-f{min-width:44px}
.fila-nota{display:flex;align-items:stretch;border-bottom:1px solid var(--linea);background:var(--blanco)}
.fila-nota .tarjeta{flex:1;min-width:0;border-bottom:0}
.mas-nota{flex:none;width:48px;min-height:48px;font-size:22px;font-weight:700;color:var(--gris);border-left:1px solid var(--linea)}
.mas-nota:active,.mas-nota[aria-expanded="true"]{background:var(--purpura-suave);color:var(--purpura)}
.menu-nota{display:flex;flex-wrap:wrap;gap:8px;padding:10px 16px;background:var(--purpura-suave);border-bottom:1px solid var(--linea)}
.menu-nota .boton{margin:0;min-height:44px;padding:10px 14px;font-size:15px}
.aviso-deshacer{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--bottom) + 20px);z-index:210;background:var(--tinta);color:#fff;border-radius:14px;padding:6px 6px 6px 16px;display:flex;gap:8px;align-items:center;box-shadow:0 8px 24px rgba(0,0,0,.3);max-width:calc(100% - 24px);font-size:15px}
.aviso-deshacer .ad-desh{min-height:44px;padding:0 14px;border-radius:10px;background:#E9C46A;color:#2B1B40;font-weight:700}
.aviso-deshacer .ad-x{min-width:44px;min-height:44px;color:#fff}
.aviso-rev{display:flex;align-items:center;gap:8px;background:#F1ECF7;border-color:#D9CCE6;color:var(--purpura);padding:4px 4px 4px 14px}
.aviso-rev>div{flex:1}
.aviso-rev .enlace{color:var(--purpura);font-weight:700;text-decoration:underline;min-height:44px;padding:0 4px}
.aviso-rev .ar-x{min-width:44px;min-height:44px;color:var(--gris)}
.rv-caso{background:var(--blanco);border-top:1px solid var(--linea);border-bottom:1px solid var(--linea);margin-top:12px;padding:12px 16px}
.rv-tipo{font-weight:700;color:var(--purpura);font-size:15px;margin-bottom:8px}
.rv-par{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:640px){.rv-par{grid-template-columns:1fr}}
.app.dividido #panel .rv-par{grid-template-columns:1fr}
.rv-nota{border:1px solid var(--linea);border-radius:12px;padding:10px 12px;min-width:0}
.rv-nota .ref{font-family:var(--serif);color:var(--ocre-texto);font-weight:700;font-size:14px}
.rv-nota .tit{font-weight:600}
.rv-prev{color:var(--gris);font-size:14px;line-height:1.4;margin:4px 0;overflow-wrap:anywhere}
.rv-nota .fecha{font-size:12px;color:var(--gris)}
.rv-btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.rv-btns .boton{margin:0;min-height:44px;padding:10px 14px;font-size:15px}
.rv-ubic{display:flex;flex-wrap:wrap;gap:6px 16px;margin-bottom:8px;font-size:15px}

  ESTILOS_OK.forEach(function(k){ var v=n.style&&n.style.getPropertyValue(k); if(v&&!/url|expression/i.test(v)) el.style.setProperty(k,v); });
  if(n.tagName.toUpperCase()==='FONT'){ var col=n.getAttribute('color'); if(col&&/^[#a-z0-9(),.\s%]+$/i.test(col)) el.style.color=col; var sz=+n.getAttribute('size'); if(sz>=5) el.style.fontSize='1.3em'; else if(sz===4) el.style.fontSize='1.12em'; }

/* lo seleccionado en la app: los bloques se vuelven saltos de línea (queda un solo párrafo) */
function limpiarFmtBosq(raiz){
  var sale=document.createElement('div');
  function copiar(origen,destino){
    Array.prototype.forEach.call(origen.childNodes,function(n){
      if(n.nodeType===3){ destino.appendChild(document.createTextNode(n.textContent)); return; }
      if(n.nodeType!==1) return;
      var tag=n.tagName.toUpperCase(), el;
      if(/^(SCRIPT|STYLE|BUTTON|INPUT|SELECT|TEXTAREA|SVG|IMG|IFRAME|OBJECT|SUP)$/.test(tag)) return;
      if(tag==='BR'){ destino.appendChild(document.createElement('br')); return; }
      if(/^(B|STRONG|H1|H2|H3|H4)$/.test(tag)) el=document.createElement('b');
      else if(/^(I|EM)$/.test(tag)) el=document.createElement('i');
      else if(tag==='U') el=document.createElement('u');
      else el=document.createElement('span');
      copiarEstilos(n,el); copiar(n,el);
      if(el.tagName==='SPAN'&&!el.getAttribute('style')){ while(el.firstChild) destino.appendChild(el.firstChild); }
      else destino.appendChild(el);
      if(/^(P|DIV|H1|H2|H3|H4|H5|H6|LI|SECTION|BLOCKQUOTE)$/.test(tag)&&destino.lastChild&&destino.lastChild.nodeName!=='BR') destino.appendChild(document.createElement('br'));
    });
  }
  copiar(raiz,sale);
  while(sale.lastChild&&sale.lastChild.nodeName==='BR') sale.removeChild(sale.lastChild);
  while(sale.firstChild&&sale.firstChild.nodeName==='BR') sale.removeChild(sale.firstChild);
  return sale.innerHTML.replace(/(<br>){3,}/g,'<br><br>');
}

/* ---------- Búsqueda (sin acentos, varias palabras, frase exacta entre comillas) ---------- */

  var res=Almacen.lista(function(n){

    if(opts.fuente&&n.fuente!==opts.fuente) return false;
    if(opts.etiqueta&&n.etiquetas.indexOf(opts.etiqueta)<0) return false;
    if(desde&&n.modificado<desde) return false;

    if(refs&&refs.some(function(r){ return notaTocaRef(n,r); })) return true;
    if(!terminos.length) return true;

function resaltar(texto,terminos){

  var plano=sinAcentos(texto); if(plano.length!==texto.length) return e; // si NFD cambió longitudes, no resaltar
  var marcas=[];
  terminos.forEach(function(t){var i=0;while((i=posTermino(plano,t,i))>=0){marcas.push([i,i+t.length]);i+=t.length;}});
  if(!marcas.length) return e;
  marcas.sort(function(a,b){return a[0]-b[0];});
  var out='',pos=0;
  marcas.forEach(function(m){ if(m[0]<pos) return; out+=esc(texto.slice(pos,m[0]))+'<mark>'+esc(texto.slice(m[0],m[1]))+'</mark>'; pos=m[1]; });
  return out+esc(texto.slice(pos));
}

/* "Génesis 6:9-22; Hebreos 11:7" → lista de referencias; sólo la primera se usa para archivar */
function analizarReferencias(texto){
  var out=[], partes=String(texto||'').split(/\s*[;|]\s*/);
  partes.forEach(function(p){
    p=p.replace(/\(\s*TNM\s*\)|\bTNM\b/gi,'').replace(/[()]/g,'').replace(/[\s.]+$/,'').trim(); if(!p) return;
    p=normalizarLibro(p);
    var m=/^(\d?\s*[A-Za-zÁÉÍÓÚÜÑáéíóúüñ][A-Za-zÁÉÍÓÚÜÑáéíóúüñ .]*?)\.?\s*(\d+)(?:\s*[:.]\s*(\d+)(?:\s*[-–—]\s*(\d+)(?:\s*[:.]\s*(\d+))?)?)?(?:\s*[,]\s*[\d,\s-–]+)?\s*$/.exec(p);
    if(!m){ out.push({texto:p,libro:-1,error:'No se reconoce la referencia'}); return; }
    var libro=buscarLibro(m[1]); if(libro<0) libro=libroDeNombre(m[1].replace(/[.\s]+$/,''));
    if(libro<0){ out.push({texto:p,libro:-1,error:'Libro no reconocido: '+m[1].trim()}); return; }
    var caps=LIBROS[libro].v, cap=+m[2], vers=m[3]?+m[3]:1, versFin=0, solo=!m[3];
    if(caps.length===1&&!m[3]&&+m[2]>1){ cap=1; vers=+m[2]; solo=false; if(m[4]&&!m[5]) versFin=+m[4]; } // Judas 9, 3 Juan 4
    else if(m[4]&&!m[5]) versFin=+m[4]; // 6:9-22
    if(cap<1||cap>caps.length){ out.push({texto:p,libro:libro,error:LIBROS[libro].n+' no tiene capítulo '+cap}); return; }
    if(vers>caps[cap-1]){ out.push({texto:p,libro:libro,error:LIBROS[libro].n+' '+cap+' tiene '+caps[cap-1]+' versículos'}); return; }
    if(!(versFin>vers&&versFin<=caps[cap-1])) versFin=0;
    out.push({texto:p,libro:libro,cap:cap,vers:vers,versFin:versFin,soloCapitulo:solo});
  });

}

function categoriaCercana(t){
  var k=sinAcentos(t).replace(/[^a-z0-9 ]/g,' ').replace(/\s+/g,' ').trim(); if(!k) return '';
  for(var i=0;i<CATEGORIAS.length;i++) if(sinAcentos(CATEGORIAS[i])===k) return CATEGORIAS[i];
  var mejor='',puntos=0;
  CATEGORIAS.forEach(function(c){ var cc=sinAcentos(c), pal=k.split(' ').filter(function(w){return w.length>3;}), p=0; pal.forEach(function(w){ if(cc.indexOf(w.replace(/es$|s$/,''))>=0) p++; }); if(p>puntos){puntos=p;mejor=c;} });
  return puntos?mejor:'';
}
function markdownAHtml(t){
  var parrafos=String(t||'').replace(/\r/g,'').trim().split(/\n\s*\n/);
  return parrafos.map(function(p){
    if(/^\s*[-*_]{3,}\s*$/.test(p)) return '';
    var cita=/^\s*>\s?/.test(p); p=p.replace(/^\s*>\s?/,'');
    var enc=/^\s*#{1,6}\s+(.+)$/.exec(p.trim()); if(enc) return '<div><b>'+esc(enc[1].replace(/\s*#+\s*$/,'').replace(/\*\*/g,'')).trim()+'</b></div>';
    if(/^\s*[-*•]\s+/.test(p)) return '<ul>'+p.split(/\n/).map(function(l){ return l.trim()?'<li>'+esc(l.replace(/^\s*[-*•]\s+/,'')).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/(^|[^*])\*([^*\n]+?)\*(?!\*)/g,'$1<i>$2</i>')+'</li>':''; }).join('')+'</ul>';
    var h=esc(p.replace(/\n+/g,' ').trim());
    h=h.replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/(^|[^*])\*([^*\n]+?)\*(?!\*)/g,'$1<i>$2</i>').replace(/_(.+?)_/g,'<i>$1</i>');
    return cita?'<blockquote>'+h+'</blockquote>':'<div>'+h+'</div>';
  }).join('');
}
function analizarBloques(texto){
  var t=String(texto||'').replace(/\r/g,'');
  // separar por líneas --- o por cada nuevo TÍTULO:
  var lineas=t.split('\n'), bloques=[], actual=[];
  function cerrar(){ if(actual.join('').trim()) bloques.push(actual.join('\n')); actual=[]; }
  var reCampo=/^\s*(?:[#>*_\-\s]*)?\**\s*(T[IÍ]TULO|TEXTO|CATEGOR[IÍ]A|NOTA|FUENTE|ETIQUETAS)\s*\**\s*:\s*\**\s*(.*)$/i;
  lineas.forEach(function(l){
    if(/^\s*[-*_]{3,}\s*$/.test(l)){cerrar();return;}
    var m=reCampo.exec(l); if(m&&/^t[ií]tulo$/i.test(m[1])&&actual.some(function(x){return /^\s*(?:[#>*_\-\s]*)?\**\s*t[ií]tulo/i.test(x);})) cerrar();
    actual.push(l);
  });
  cerrar();
  var notas=[];
  bloques.forEach(function(b){
    var campos={}, campo=null;
    b.split('\n').forEach(function(l){
      var m=reCampo.exec(l), k=m?sinAcentos(m[1]).toLowerCase():null;
      if(m&&campo&&campos.hasOwnProperty(k)) m=null; /* "Texto:" o "Nota:" repetido dentro del cuerpo es parte del texto */
      if(m){ campo=k; campos[campo]=(m[2]||'').replace(/\*+$/,'').trim(); }
      else if(campo){ campos[campo]+='\n'+l; }
    });
    var tiene=campos.titulo||campos.texto||campos.nota;
    if(!tiene){ return; }
    var refs=analizarReferencias(campos.texto||''), r=refs[0]||{libro:-1,error:'Falta la línea TEXTO'};
    var catOrig=(campos.categoria||'').trim(), cat=categoriaCercana(catOrig);
    notas.push({titulo:(campos.titulo||'').replace(/\*+/g,'').trim(),textoOrig:(campos.texto||'').trim(),refs:refs,ref:r,categoriaOrig:catOrig,categoria:cat,nota:(campos.nota||'').trim(),fuente:(campos.fuente||'').trim(),etiquetas:(campos.etiquetas||'').trim(),
      error:r.error||(!campos.titulo?'Falta el TÍTULO':'')});
  });
  if(!notas.length&&t.trim()) return analizarLibre(t);
  return notas;
}
/* Modo libre: un análisis pegado tal cual (sin TÍTULO/TEXTO). La primera línea con una cita es el título y la
   referencia; si hay varios encabezados "# " con cita, cada uno abre una nota. */
function analizarLibre(t){
  var lineas=t.split('\n'), notas=[], actual=null;
  function refDeLinea(l){ var c=citasEnTexto(l.replace(/[#*_>"«»“”]/g,' ')); return c.length?c[0]:null; }
  function cerrar(){ if(!actual) return; var cuerpo=actual.lineas.join('\n').trim(); var refs=analizarReferencias(referencia(actual.ref)); notas.push({titulo:actual.titulo,textoOrig:referencia(actual.ref),refs:refs,ref:refs[0],categoriaOrig:actual.categoria||'',categoria:categoriaCercana(actual.categoria||''),nota:cuerpo,fuente:'',etiquetas:'',error:'',libre:true}); actual=null; }
  var reCat=/^\s*\**\s*categor[ií]a\s*\**\s*:\s*(.+)$/i;
  for(var i=0;i<lineas.length;i++){
    var l=lineas[i], limpia=l.replace(/^\s*#+\s*/,'').replace(/\*\*/g,'').trim();
    var esH1=/^\s*#\s+/.test(l), ref=refDeLinea(l);
    if(ref&&(!actual||esH1)){ cerrar(); actual={titulo:limpia.replace(/^\s*[-–—]\s*/,'').slice(0,140),ref:ref,lineas:[],categoria:''}; continue; }
    if(!actual) continue; // texto antes de la primera cita: se ignora
    var mc=reCat.exec(l); if(mc){ actual.categoria=mc[1].trim(); continue; }
    actual.lineas.push(l);
  }
  cerrar();
  return notas;
}
/* Convierte un bloque analizado en una nota y la guarda; devuelve la nota o null si es duplicada */
function archivarBloque(b,opciones){
  var r=b.ref; if(!(r.libro>=0)||!r.cap) return null;
  var html=markdownAHtml(b.nota);
  if(b.textoOrig&&!b.libre) html='<div><i>Texto: '+esc(b.textoOrig)+'</i></div>'+html;
  var dup=Almacen.lista(function(n){return n.libro===r.libro&&n.cap===r.cap&&n.vers===r.vers&&sinAcentos(n.titulo)===sinAcentos(b.titulo);});
  if(dup.length&&!opciones.permitirDuplicados) return {duplicada:true,nota:dup[0]};
  var etq=(b.etiquetas?b.etiquetas.split(','):[]).concat(opciones.etiquetas||[]);
  var n=Almacen.crear(r.libro,r.cap,r.vers,r.versFin);
  n=Almacen.actualizar(n.id,{titulo:b.titulo||'Sin título',html:html,categoria:b.categoria||opciones.categoria||'',fuente:b.fuente||opciones.fuente||'',etiquetas:etq});
  return {duplicada:false,nota:n};
}

/* v2.65: aviso de respaldo en la portada (hay cambios y más de 7 días sin respaldo); ✕ lo oculta hasta mañana */
function avisoRespaldoHtml(){
  var notas=Almacen.datos.notas, ids=Object.keys(notas); if(!ids.length) return '';
  var ult=0, oculto=''; try{ ult=+localStorage.getItem('mln.respaldo')||0; oculto=localStorage.getItem('mln.avisoResp')||''; }catch(e){}
  if(oculto===fechaClave()) return '';
  if(ult&&ahora()-ult<7*864e5) return '';
  var cambios=!ult, k;
  if(!cambios) for(k=0;k<ids.length;k++) if(notas[ids[k]].modificado>ult){ cambios=true; break; }
  if(!cambios) for(k in Almacen.datos.borradas) if(Almacen.datos.borradas[k]>ult){ cambios=true; break; }
  if(!cambios) return '';
  var dias=ult?Math.floor((ahora()-ult)/864e5):0;
  return '<div class="aviso-portada" id="avisoRespaldo"><div>💾 '+(ult?'Hace '+dias+' días que no guarda un respaldo':'Todavía no ha guardado un respaldo')+' y sus notas tienen cambios. El respaldo en Archivos las protege si el iPad se pierde.</div><div class="ap-btns"><button class="boton" data-acc="descargar">Guardar respaldo ahora</button><button class="boton secundario" data-acc="ocultar-aviso-resp" aria-label="Ocultar hasta mañana" title="Ocultar hasta mañana">✕</button></div></div>';
}
function recientesHtml(){
  var ns=[], k; for(k in Almacen.datos.notas) ns.push(Almacen.datos.notas[k]);
  if(!ns.length) return '';
  ns.sort(function(a,b){ return b.modificado-a.modificado; });
  return '<div class="recientes"><div class="seccion">Notas recientes</div><div class="lista">'+ns.slice(0,8).map(function(n){
    return '<button class="tarjeta" data-nota="'+esc(n.id)+'"><div class="cuerpo-tarjeta"><div class="libro">'+esc(referencia(n))+'</div><div class="tit">'+esc(n.titulo||'Sin título')+'</div><div class="fecha">'+fechaCorta(n.modificado)+'</div></div></button>';
  }).join('')+'</div></div>';
}

/* Abre una base del mismo sitio sin crearla si no existe (null si no está) */
function abrirExistente(nombre){
  var hay=(indexedDB.databases?indexedDB.databases().then(function(l){ return l.some(function(d){ return d.name===nombre; }); },function(){ return true; }):Promise.resolve(true));
  return hay.then(function(existe){ if(!existe) return null; return new Promise(function(res){ var nueva=false, r;
    try{ r=indexedDB.open(nombre); }catch(e){ return res(null); }
    r.onupgradeneeded=function(){ nueva=true; try{ r.transaction.abort(); }catch(e){} };
    r.onsuccess=function(){ if(nueva){ try{ r.result.close(); }catch(e){} return res(null); } res(r.result); };
    r.onerror=function(e){ try{ e.preventDefault(); }catch(x){} res(null); }; r.onblocked=function(){ res(null); };
  }); });
}
/* Recorre todos los almacenes de una base; porRegistro(valor, cursor) puede devolver true para borrar ese registro */
function recorrerBase(nombre,porRegistro,escribir){
  return abrirExistente(nombre).then(function(db){ if(!db) return {bytes:0,n:0,borrados:0,bytesBorrados:0};
    return new Promise(function(res,rej){ var out={bytes:0,n:0,borrados:0,bytesBorrados:0}, nombres=[].slice.call(db.objectStoreNames);
      if(!nombres.length){ db.close(); return res(out); }
      try{ var tx=db.transaction(nombres,escribir?'readwrite':'readonly');
        nombres.forEach(function(s){ var c=tx.objectStore(s).openCursor(); c.onsuccess=function(){ var cur=c.result; if(!cur) return; var tam=tamValor(cur.value)+tamValor(cur.key); out.bytes+=tam; out.n++;
          if(porRegistro&&porRegistro(cur.value,cur)){ try{ cur.delete(); out.borrados++; out.bytesBorrados+=tam; }catch(e){} } cur.continue(); }; });
        tx.oncomplete=function(){ db.close(); res(out); }; tx.onerror=tx.onabort=function(){ db.close(); rej(tx.error||new Error('base no disponible')); };
      }catch(e){ try{ db.close(); }catch(x){} rej(e); } }); });
}
/* Audio de Conversa 7.18: base 'conversa-audio', almacén "a", llave texto, registro {voz, blob, t, bytes, uso}.

function tamAudio(v){ if(!v) return 0; if(+v.bytes>0) return +v.bytes; if(v.blob&&typeof v.blob.size==='number') return v.blob.size; return tamValor(v); }
function recorrerAudio(porRegistro,escribir){
  return abrirExistente('conversa-audio').then(function(db){ var out={bytes:0,n:0,borrados:0,bytesBorrados:0};
    if(!db) return out;
    if(!db.objectStoreNames.contains('a')){ db.close(); return out; }
    return new Promise(function(res,rej){ try{ var tx=db.transaction('a',escribir?'readwrite':'readonly'), c=tx.objectStore('a').openCursor();
      c.onsuccess=function(){ var cur=c.result; if(!cur) return; var tam=tamAudio(cur.value); out.bytes+=tam; out.n++;
        if(porRegistro&&porRegistro(cur.value)){ try{ cur.delete(); out.borrados++; out.bytesBorrados+=tam; }catch(e){} } cur.continue(); };
      tx.oncomplete=function(){ db.close(); res(out); }; tx.onerror=tx.onabort=function(){ db.close(); rej(tx.error||new Error('audio no disponible')); };
    }catch(e){ try{ db.close(); }catch(x){} rej(e); } }); });
}

function generarDiscurso(d){

  var cupoPorPunto=usadas.length?Math.floor(cupoPuntos/usadas.length):0;

/* ---------- Editor ---------- */
var notaAbierta=null, tGuardar=null, sucio=false, modoEdicion=false, tecladoPedido=false;
function montarEditor(){
  notaAbierta=Almacen.obtener(ruta.id); if(!notaAbierta) return;
  var cuerpo=$('#cuerpo'), titulo=$('#titulo');
  try{document.execCommand('styleWithCSS',false,false);}catch(e){}
  function marcar(){sucio=true;clearTimeout(tGuardar);tGuardar=setTimeout(guardarPendiente,500);}
  cuerpo.addEventListener('input',marcar);
  titulo.addEventListener('input',marcar);
  $('#vers').addEventListener('change',marcar);
  $('#versFin').addEventListener('change',marcar);
  $('#categoria').addEventListener('change',marcar);
  $('#fuente').addEventListener('change',marcar);
  $('#etiquetas').addEventListener('input',marcar);
  if(modoEdicion){ barra.classList.add('ver'); ajustarBarra(); edPrepararZona('cuerpo',notaAbierta.id,tecladoPedido); }
  else delete ED.cuerpo;
  cuerpo.addEventListener('paste',function(e){ // pegar como texto limpio
    if(!e.clipboardData) return;
    e.preventDefault();
    var t=e.clipboardData.getData('text/plain');
    try{document.execCommand('insertText',false,t);}catch(err){}
    marcar();
  });
  // Borrado en dos toques con autocancelación
  var b=$('#borrar'), armado=false, tArm;
  b.addEventListener('click',function(){
    if(!armado){armado=true;b.textContent='¿Borrar? Toque otra vez';b.classList.add('armado');tArm=setTimeout(function(){armado=false;b.textContent='Borrar nota';b.classList.remove('armado');},5000);return;}
    clearTimeout(tArm); sucio=false; clearTimeout(tGuardar);
    Almacen.borrar(notaAbierta.id); notaAbierta=null; aviso(_db?'Nota borrada · queda 30 días en Ajustes → Papelera':'Nota borrada'); if(dividido()) cerrarNota(); else atras();
  });

}
function guardarPendiente(){
  clearTimeout(tGuardar);
  if(!sucio||!notaAbierta) return;
  var cuerpo=$('#cuerpo'), titulo=$('#titulo'), vs=$('#vers'), vf=$('#versFin');
  if(!cuerpo||!titulo) {sucio=false;return;}
  if(!modoEdicion){sucio=false;return;}
  var html=limpiarHTML(cuerpo.innerHTML); if(!textoPlano(html)&&!/<(ul|ol|li)/i.test(html)) html='';
  var n=Almacen.actualizar(notaAbierta.id,{titulo:titulo.value.trim(),html:html,vers:parseInt(vs.value,10),versFin:parseInt(vf.value,10),categoria:$('#categoria').value,fuente:$('#fuente').value,etiquetas:$('#etiquetas').value},true);
  sucio=false;
  if(!n){ aviso('⚠️ Esta nota ya no existe (se borró en otra ventana). Copie su texto antes de salir.'); return; }
  if(n){ notaAbierta=n; var pie=$('.pie-nota span');
    if(pie){ pie.innerHTML='Creada '+fechaCorta(n.creado)+' · <b class="estadoGuardado" style="color:var(--gris)">Guardando…</b>';
      Almacen.esperarGuardado().then(function(ok){ var b=pie.querySelector('.estadoGuardado'); if(!b) return; if(ok){ b.style.color='var(--verde)'; b.textContent='Guardado ✓'; b.insertAdjacentText('afterend',' '+fechaCorta(n.modificado)); } else { b.style.color='#B3261E'; b.textContent='⚠️ No guardado'; } }); }
    refrescarPanelCitas(); var p=$('.editor .pos'); if(p){ var tmp=document.createElement('div'); tmp.innerHTML=posicionNota(n); p.parentNode.replaceChild(tmp.firstChild,p);} }

/* Botoneras: la acción va al soltar el dedo (si no se movió: así la barra se puede desplazar sin aplicar nada);

function edBotonera(cont,accion){

  cont.addEventListener('pointercancel',function(){ pd=null; });
  cont.addEventListener('pointerup',function(e){ var p=pd; pd=null; if(!p) return; var b=e.target.closest('button');
    if(b!==p.b||b.disabled||Math.abs(e.clientX-p.x)>14||Math.abs(e.clientY-p.y)>14) return; e.preventDefault(); b._edHecho=Date.now(); accion(b); });

  cont.addEventListener('click',function(e){ var b=e.target.closest('button'); if(!b||!cont.contains(b)) return; e.preventDefault(); if(b._edHecho&&Date.now()-b._edHecho<900) return; if(e.detail===0) accion(b); });

    t=t.replace(/[#*_>|~`•●▪►➤]+/g,' ');                                                        /* marcas de formato y viñetas */

/* ==================== v2.66 · REVISIÓN DE NOTAS REPETIDAS O MAL UBICADAS ====================
   Corre sola unos segundos después de abrir la app si pasaron 7 días o más desde la última, en pedacitos de 12 ms
   (no traba). También desde Ajustes. NADA se cambia sin que el usuario toque un botón.
   (a) repetidas: mismo texto normalizado (sin HTML, espacios, mayúsculas ni acentos) o ≥ 90 % de parecido
       (Jaccard sobre grupos de 3 palabras; candidatos por los 12 valores más chicos de cada nota → sin comparar todas con todas);
   (b) mal ubicadas: la línea «Texto: …» que pone el importador (o el título que empieza con una cita) señala otro
       libro/capítulo/versículo, o el versículo no existe en ese capítulo.

/* corre la revisión en pedacitos; devuelve una promesa con la lista de casos (sin los marcados «Están bien») */
function revisarNotas(){

  var ids=Object.keys(Almacen.datos.notas), i=0, datos=[], exactos={}, casos=[];

    function fase1(){ var t0=performance.now();
      while(i<ids.length&&performance.now()-t0<12){ var n=Almacen.datos.notas[ids[i++]]; if(!n) continue;
        var u=revUbicacion(n); if(u) casos.push({tipo:'ubic',clave:'m:'+n.id+':'+n.libro+':'+n.cap+':'+n.vers+':'+(n.versFin||0),id:n.id,motivo:u.motivo,sug:u.sug});
        var norm=revNorm(textoPlano(n.html)); if(norm.length<3) continue;
        if(exactos[norm]){ exactos[norm].push(n.id); continue; }
        exactos[norm]=[n.id];
        var pal=norm.split(' '); if(pal.length<8) continue;

      var cubo=new Map(), pares=new Map();

      cubo.forEach(function(l){ if(l.length<2||l.length>150) return; for(var x=0;x<l.length;x++) for(var y=x+1;y<l.length;y++){ var key=l[x]*100000+l[y]; pares.set(key,(pares.get(key)||0)+1); } });

      var p=0;
